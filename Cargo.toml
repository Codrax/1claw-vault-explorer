[package]
name = "vault-explorer"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "6.0.0"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
urlencoding = "2.1.3"
